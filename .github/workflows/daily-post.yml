name: Daily Post

# Fetches trending GitHub repos, generates the carousel + captions, commits
# that day's content to main as an archive, and posts directly to Bluesky +
# Mastodon -- fully automatic, no review step. (Replaces the old
# daily-draft.yml + publish-on-merge.yml PR-review flow, used while output
# quality was being validated; switched to auto-publish after five days of
# reviewed output.)
#
# Runs at 19:00 UTC = 05:00 AEST (Sydney, standard time, roughly Apr-Oct).
# GitHub Actions cron is always UTC and doesn't shift for daylight saving,
# so during AEDT (roughly Oct-Apr) this lands at 06:00 Sydney time instead
# of 05:00. Bump the cron hour by 1 (to "0 18 * * *") if you want to
# correct for that during AEDT months, and back to 19 when AEST resumes.
#
# workflow_dispatch triggers a real post immediately -- there's no draft
# stage to intercept it.

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Generate today's content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DIR="content/$DATE"
          mkdir -p "$DIR"
          # --link intentionally omitted below until there's a real CTA
          # destination (newsletter/affiliate link) -- add `--link "..."`
          # to both commands once one's chosen.
          python fetch_trending.py --limit 5 --out "$DIR/repo_data.json"

          # Captions run first -- it's also where the carousel's tagline
          # and CTA copy get written, so the carousel needs its output.
          python make_captions.py "$DIR/repo_data.json" \
            --out "$DIR/captions.json"

          TAGLINE=$(jq -r '.tagline' "$DIR/captions.json")
          CTA_HEADLINE=$(jq -r '.cta_headline' "$DIR/captions.json")
          CTA_SUBTEXT=$(jq -r '.cta_subtext' "$DIR/captions.json")

          python make_carousel.py "$DIR/repo_data.json" "$DIR/out" \
            --handle "@yourdailyoss.bsky.social" \
            --tagline "$TAGLINE" \
            --cta-headline "$CTA_HEADLINE" \
            --cta-subtext "$CTA_SUBTEXT"

          echo "CONTENT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Archive today's content on main
        run: |
          git config user.name "yourdailyoss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$CONTENT_DIR"
          git commit -m "Daily content: $DATE"
          git pull --rebase origin main
          git push origin main

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python post_bluesky.py "$CONTENT_DIR/out" "$CONTENT_DIR/repo_data.json" "$CONTENT_DIR/captions.json"

      - name: Post to Mastodon
        if: always()
        env:
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          python post_mastodon.py "$CONTENT_DIR/out" "$CONTENT_DIR/repo_data.json" "$CONTENT_DIR/captions.json"
